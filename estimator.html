<title>Social Research Microsoft BC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F3FC; --surface:#FFFFFF; --surface-2:#F0E9FB; --surface-3:#E7DCFA;
  --border:rgba(30,10,64,.13); --border-strong:rgba(30,10,64,.24);
  --text-1:#180B33; --text-2:#5B5270; --text-3:#8B84A3;
  --brand:#4A00E1; --brand-2:#7900E1; --brand-ink:#FFFFFF; --brand-wash:rgba(74,0,225,.08); --brand-wash-strong:rgba(74,0,225,.14);
  --mint:#00B189; --mint-ink:#FFFFFF; --mint-wash:rgba(0,177,137,.12);
  --good:#0ca30c; --warning:#9a6300; --critical:#c23b3b;
  --good-wash:rgba(12,163,12,.12); --warning-wash:rgba(250,178,25,.18); --critical-wash:rgba(208,59,59,.12);
  --shadow:0 1px 2px rgba(24,11,51,.06),0 10px 28px -14px rgba(24,11,51,.22);
  --radius:14px; --radius-sm:9px;
  --font-display:'Poppins',system-ui,sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --chart-surface:#fcfcfb; --chart-ink:#0b0b0b; --chart-ink-2:#52514e; --chart-muted:#898781; --chart-grid:#e1e0d9; --chart-axis:#c3c2b7;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
  --chart-good:#0ca30c; --chart-warning:#fab219; --chart-critical:#d03b3b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120A24; --surface:#1B1130; --surface-2:#241A3D; --surface-3:#2D2050;
    --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.24);
    --text-1:#F5F1FF; --text-2:#C7BEDD; --text-3:#8F86A8;
    --brand:#9B6BFF; --brand-2:#B48CFF; --brand-ink:#180A33; --brand-wash:rgba(155,107,255,.16); --brand-wash-strong:rgba(155,107,255,.26);
    --mint:#39D6B4; --mint-ink:#052A22; --mint-wash:rgba(57,214,180,.16);
    --good:#3fd23f; --warning:#f6b93b; --critical:#ff6b6b;
    --good-wash:rgba(63,210,63,.14); --warning-wash:rgba(246,185,59,.16); --critical-wash:rgba(255,107,107,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.6);
    --chart-surface:#1a1a19; --chart-ink:#ffffff; --chart-ink-2:#c3c2b7; --chart-muted:#898781; --chart-grid:#2c2c2a; --chart-axis:#383835;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#3fbf3f; --series-7:#9085e9; --series-8:#e66767;
    --chart-good:#3fd23f; --chart-warning:#f6b93b; --chart-critical:#ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120A24; --surface:#1B1130; --surface-2:#241A3D; --surface-3:#2D2050;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.24);
  --text-1:#F5F1FF; --text-2:#C7BEDD; --text-3:#8F86A8;
  --brand:#9B6BFF; --brand-2:#B48CFF; --brand-ink:#180A33; --brand-wash:rgba(155,107,255,.16); --brand-wash-strong:rgba(155,107,255,.26);
  --mint:#39D6B4; --mint-ink:#052A22; --mint-wash:rgba(57,214,180,.16);
  --good:#3fd23f; --warning:#f6b93b; --critical:#ff6b6b;
  --good-wash:rgba(63,210,63,.14); --warning-wash:rgba(246,185,59,.16); --critical-wash:rgba(255,107,107,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.6);
  --chart-surface:#1a1a19; --chart-ink:#ffffff; --chart-ink-2:#c3c2b7; --chart-muted:#898781; --chart-grid:#2c2c2a; --chart-axis:#383835;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#3fbf3f; --series-7:#9085e9; --series-8:#e66767;
  --chart-good:#3fd23f; --chart-warning:#f6b93b; --chart-critical:#ff6b6b;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;color:var(--text-1);margin:0;text-wrap:balance;}
a{color:var(--brand);}
button{font-family:var(--font-body);}
::selection{background:var(--brand-wash-strong);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

.app{display:flex;min-height:100vh;}
.rail{width:238px;flex:0 0 238px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.rail-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.rail-brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;}
.rail-brand .name{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2;}
.rail-brand .sub{font-size:11px;color:var(--text-3);letter-spacing:.02em;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-size:13.5px;font-weight:500;border:1px solid transparent;background:none;text-align:left;width:100%;}
.nav-item .num{width:20px;height:20px;border-radius:6px;background:var(--surface-2);color:var(--text-3);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 20px;}
.nav-item:hover{background:var(--surface-2);color:var(--text-1);}
.nav-item.active{background:var(--brand-wash);color:var(--brand);font-weight:600;border-color:var(--brand-wash-strong);}
.nav-item.active .num{background:var(--brand);color:var(--brand-ink);}
.rail-foot{margin-top:auto;padding:12px 8px 0;font-size:11px;color:var(--text-3);border-top:1px solid var(--border);}

main{flex:1;min-width:0;display:flex;flex-direction:column;}
.kpibar{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:10px;overflow-x:auto;}
.kpi-chip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:7px 14px;border-radius:10px;background:var(--surface-2);min-width:104px;}
.kpi-chip .l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.kpi-chip .v{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--text-1);font-variant-numeric:tabular-nums;}
.kpi-chip.accent{background:var(--brand-wash);}
.kpi-chip.accent .v{color:var(--brand);}

.panel{padding:26px 32px 70px;display:none;max-width:1180px;}
.panel.active{display:block;}
.panel-head{margin-bottom:6px;}
.panel-head h1{font-size:22px;}
.panel-sub{color:var(--text-2);font-size:13.5px;margin:6px 0 22px;max-width:760px;}
.example-banner{display:flex;gap:10px;align-items:flex-start;background:var(--mint-wash);border:1px solid color-mix(in srgb, var(--mint) 40%, transparent);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:20px;font-size:13px;color:var(--text-1);}
.example-banner b{color:var(--mint-ink);background:var(--mint);padding:1px 7px;border-radius:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}

/* accordion */
details.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
details.acc>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:14.5px;}
details.acc>summary::-webkit-details-marker{display:none;}
details.acc>summary .chevron{margin-left:auto;color:var(--text-3);transition:transform .15s;}
details.acc[open]>summary .chevron{transform:rotate(90deg);}
details.acc>summary .badge-num{width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--text-2);font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 24px;}
details.acc[open]>summary .badge-num{background:var(--brand);color:var(--brand-ink);}
details.acc .acc-body{padding:4px 20px 20px;border-top:1px solid var(--border);}
details.acc summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--text-2);font-weight:500;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select{
  font-family:var(--font-body);font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);width:100%;
}
.field input:focus,.field select:focus,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
.section-label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.section-label:first-child{margin-top:2px;}

.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;cursor:pointer;user-select:none;color:var(--text-2);}
.chip input{accent-color:var(--brand);}
.chip.checked{background:var(--brand-wash);border-color:var(--brand);color:var(--brand);font-weight:600;}

.mgrid{display:grid;gap:16px;margin-top:6px;}
.mgroup h4{font-size:12.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;font-family:var(--font-body);font-weight:600;}

table.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
table.ctable th,table.ctable td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--border);}
table.ctable th{color:var(--text-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.ctable select{font-size:12.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);width:100%;}
.rowlabel{font-weight:500;color:var(--text-1);}

.btn{font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
.btn.primary:hover{background:var(--brand-2);}
.btn.ghost{background:none;border-color:transparent;color:var(--brand);padding:6px 4px;}
.btn.sm{padding:6px 11px;font-size:12px;}

.int-row{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface-2);}
.int-row .row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.int-row .row-top strong{font-size:13px;}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
@media (max-width:920px){.grid2,.grid3{grid-template-columns:1fr;}}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);}
.stat-tile .l{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.stat-tile .v{font-family:var(--font-mono);font-size:24px;font-weight:600;color:var(--text-1);font-variant-numeric:tabular-nums;}
.stat-tile .v small{font-size:13px;color:var(--text-3);font-weight:500;}
.stat-tile.accent{background:linear-gradient(135deg,var(--brand-wash),var(--surface));border-color:var(--brand-wash-strong);}
.stat-tile.accent .v{color:var(--brand);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill.good{background:var(--good-wash);color:var(--good);}
.pill.warning{background:var(--warning-wash);color:var(--warning);}
.pill.critical{background:var(--critical-wash);color:var(--critical);}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 12px;box-shadow:var(--shadow);margin-bottom:18px;}
.chart-card h3{font-size:13.5px;margin-bottom:2px;}
.chart-card .cap{font-size:11.5px;color:var(--text-3);margin-bottom:10px;}
.chart-wrap{position:relative;}
details.tbl-toggle{margin-top:8px;}
details.tbl-toggle summary{cursor:pointer;font-size:11.5px;color:var(--brand);list-style:none;font-weight:600;}
details.tbl-toggle summary::-webkit-details-marker{display:none;}

.timeline{display:flex;flex-direction:column;gap:7px;margin-top:16px;}
.tl-row{display:grid;grid-template-columns:168px 1fr;gap:12px;align-items:center;}
.tl-label{font-size:12.5px;font-weight:500;text-align:right;}
.tl-label .wk{display:block;font-size:10.5px;color:var(--text-3);font-weight:400;}
.tl-track{position:relative;height:22px;background:var(--surface-2);border-radius:6px;}
.tl-bar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--series-1);}
.tl-bar.parallel{background:var(--series-3);}
.tl-axis{display:grid;grid-template-columns:168px 1fr;gap:12px;margin-top:4px;}
.tl-axis .ax{font-size:10.5px;color:var(--text-3);display:flex;justify-content:space-between;}

.role-bar-row{display:grid;grid-template-columns:180px 1fr 70px;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px;}
.role-bar-track{height:14px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
.role-bar-fill{height:100%;background:var(--series-7);}

.reg-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.reg-table th{text-align:left;color:var(--text-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border-strong);}
.reg-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.reg-table tr:last-child td{border-bottom:none;}

.qa-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media (max-width:920px){.qa-col{grid-template-columns:1fr;}}
.qa-card{border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);}
.qa-card.crit{background:var(--critical-wash);border-color:color-mix(in srgb, var(--critical) 35%, transparent);}
.qa-card.imp{background:var(--warning-wash);border-color:color-mix(in srgb, var(--warning) 35%, transparent);}
.qa-card.nice{background:var(--surface-2);}
.qa-card h4{font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
.qa-card ul{margin:0;padding-left:18px;font-size:12.5px;}
.qa-card li{margin-bottom:7px;}

.exec-block{margin-bottom:18px;}
.exec-block h3{font-size:14px;margin-bottom:6px;}
.exec-block p{margin:0;color:var(--text-2);font-size:13.5px;max-width:760px;}
.commercial-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:16px 0;}
.cg-item .l{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;}
.cg-item .v{font-size:14px;font-weight:600;margin-top:2px;}

.scenario-table{width:100%;border-collapse:collapse;font-size:13px;}
.scenario-table th,.scenario-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;}
.scenario-table th{font-family:var(--font-display);font-size:13px;}
.scenario-table td.metric{color:var(--text-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.scenario-table td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

.method-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:14px 16px;font-size:12.5px;color:var(--text-2);margin-top:6px;}
.method-box code{background:var(--surface);padding:1px 5px;border-radius:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-1);}

.footer-note{color:var(--text-3);font-size:11.5px;margin-top:30px;padding-top:14px;border-top:1px solid var(--border);}

@media (max-width:860px){
  .app{flex-direction:column;}
  .rail{width:100%;flex:0 0 auto;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:10px;align-items:center;}
  .rail-brand{border-bottom:none;margin-bottom:0;padding:0 10px;}
  .rail-foot{display:none;}
  .nav-item{white-space:nowrap;width:auto;}
  .panel{padding:20px 16px 60px;}
  .kpibar{padding:10px 16px;}
}
</style>

  ["legacy_erp","Legacy ERP replacement"],["excel_dependency","Excel dependency"],["fin_visibility","Poor financial visibility"],

const MODULES = [

  {id:'cashbank',label:'Cash & Bank Management',group:'Core Finance',ws:'finance',h:20},

function needsPremium(modSet){
  const premiumModIds = ["prodbom","routings","prodorders","capacity","mrp","mfgcosting","shopfloor","svcmgmt","svcorders","svccontracts","svcitems"];
  return premiumModIds.some(id=>modSet.has(id));

function licensingEngine(state){
  const c = state.customer;
  const premium = needsPremium(state.modules);
  const finance = Math.max(0, c.financeUsers||0);
  const ops = Math.max(0, c.opsUsers||0);
  const wh = Math.max(0, c.whUsers||0);
  const mfg = Math.max(0, c.mfgUsers||0);
  const ext = Math.max(0, c.extUsers||0);
  const totalUsers = Math.max(0, c.users||0);
  const namedFull = finance + ops + wh + mfg;
  const fullUsers = Math.min(totalUsers, namedFull) || Math.min(totalUsers, Math.ceil(totalUsers*0.6));
  const teamMembers = Math.max(0, totalUsers - fullUsers);
  const extAccountants = Math.min(3, ext);
  const extBeyondFree = Math.max(0, ext - 3);
  const fullLicense = premium ? BC_LICENSES[1] : BC_LICENSES[0];
  const teamLicense = BC_LICENSES[2];
  const fullCostMonthly = fullUsers * fullLicense.monthly;
  const teamCostMonthly = teamMembers * teamLicense.monthly;
  const extCostMonthly = extBeyondFree * fullLicense.monthly;
  const totalMonthly = fullCostMonthly + teamCostMonthly + extCostMonthly;
  const totalAnnual = totalMonthly * 12;
  return {premium, fullUsers, teamMembers, extAccountants, extBeyondFree, fullLicense, teamLicense,
    fullCostMonthly, teamCostMonthly, extCostMonthly, totalMonthly, totalAnnual, totalUsers};
}

/* ============================= ENGINE HELPERS ============================= */
function userBandIndex(u){ if(u<=10)return 0; if(u<=25)return 1; if(u<=75)return 2; if(u<=150)return 3; if(u<=300)return 4; return 5; }
const BAND_ADD=[0,.05,.15,.30,.45,.62];
function userBandFactor(u){ return 1+BAND_ADD[userBandIndex(u)]; }
function industryFactor(level){ return {Low:0.92,Medium:1.0,High:1.15,"Very High":1.32}[level]||1; }
function companiesFactor(n){ return 1+Math.min(0.55, 0.18*Math.max(0,n-1)); }
function round5(n){ return Math.round(n/5)*5; }
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
function fmtH(n){ return Math.round(n).toLocaleString('en-AU'); }

function modulesByWs(modSet, ws){ return MODULES.filter(m=>modSet.has(m.id) && m.ws===ws); }
function moduleHours(modSet, ws){ return sum(modulesByWs(modSet,ws).map(m=>m.h)); }

/* ============================= CORE ENGINE ============================= */
// Runs the full bottom-up model against a (possibly adjusted) state snapshot.
function runEngine(s){
  const c = s.customer;
  const uf = userBandFactor(c.users);
  const cof = companiesFactor(c.companies);
  const indf = industryFactor(c.industryComplexity);
  const A = s.complexity.areas;
  const af = k => CFACTOR[A[k]] || 1;

  const ws = {}; // workstream hours
  ws.discovery = 50 + s.modules.size*1.3 + (c.companies-1)*12 + s.challenges.size*1.6;
  ws.discovery *= indf;

  ws.finance = moduleHours(s.modules,'finance') * af('finance') * uf * cof;
  ws.sales = moduleHours(s.modules,'sales') * af('sales') * uf * cof;
  ws.purchasing = moduleHours(s.modules,'purchasing') * af('purchasing') * uf * cof;
  ws.inventory = moduleHours(s.modules,'inventory') * af('inventory') * uf * cof;
  ws.warehouse = moduleHours(s.modules,'warehouse') * af('warehouse') * uf * cof;
  ws.manufacturing = moduleHours(s.modules,'manufacturing') * af('manufacturing') * uf * cof;
  ws.projects = moduleHours(s.modules,'projects') * af('projects') * uf * cof;
  ws.service = moduleHours(s.modules,'service') * af('service') * uf * cof;

  const reportingModuleHrs = moduleHours(s.modules,'reporting');
  const reportingItemHrs = sum([...s.reporting.items].map(id=>{
    const it = REPORTING_ITEMS.find(r=>r[0]===id); return it? it[2]:0;
  }));
  ws.reporting = (reportingModuleHrs + reportingItemHrs) * af('reporting') * (CFACTOR[s.reporting.complexity]||1);

  ws.integrations = sum(s.integrations.map(row=>{
    let h = INT_COMPLEXITY_HOURS[row.complexity]||90;
    h *= (row.direction==='Bidirectional')?1.28:(row.direction==='Outbound'?1.08:1.0);
    h *= (row.mode==='Real-time')?1.22:1.0;
    h *= 1 + Math.max(0,(row.interfaces||1)-1)*0.18;
    return h;
  })) * af('integrations');

  const custModuleHrs = moduleHours(s.modules,'customization');
  const custItemHrs = sum(CUSTOM_ITEMS.map(([key,label,unit])=> (s.customization.items[key]||0)*unit ));
  ws.customization = (CUSTOM_LEVEL_BASE[s.customization.level]||0 + custModuleHrs + custItemHrs) * af('customization');

  // migration
  const migEntityHrs = sum([...s.migration.scope].map(id=>{ const it=MIGRATION_SCOPE.find(m=>m[0]===id); return it?it[2]:0; }));
  const migCf = CFACTOR[s.migration.complexity]||1;
  const migDq = {Excellent:0.85,Good:1.0,Moderate:1.25,Poor:1.6,Unknown:1.42}[s.migration.dataQuality]||1;
  const migCyclesF = 1 + (Math.max(1,s.migration.cycles)-1)*0.35;
  const migCutover = 20 + c.companies*8;
  ws.migration = (migEntityHrs*migCf*migDq*migCyclesF + migCutover) * cof;

  ws.architecture = 45 + s.integrations.length*9 + (Object.keys(CUSTOM_LEVEL_BASE).indexOf(s.customization.level))*13 + (c.companies-1)*10 + (s.localization.multiCountry?20:0);
  ws.security = 25 + userBandIndex(c.users)*9 + (c.companies-1)*8 + (c.extUsers>0?15:0);

  const preTest = ws.finance+ws.sales+ws.purchasing+ws.inventory+ws.warehouse+ws.manufacturing+ws.projects+ws.service+ws.reporting+ws.integrations+ws.customization;
  ws.testing = 0.22*preTest;

  ws.training = 16 + Math.min(c.users,500)*0.34 + (c.companies-1)*6;
  if(s.delivery.model!=='Big Bang') ws.training *= 1.12;

  ws.deployment = 30 + c.companies*10 + (s.delivery.model!=='Big Bang'?24:0) + ws.migration*0.05;
  ws.hypercare = 40 + userBandIndex(c.users)*9 + c.companies*6 + (s.support.model==='24x7'?22:s.support.model==='24x5'?12:0);
  ws.documentation = 0.05*(preTest+ws.migration);

  const prePM = ws.discovery+ws.architecture+ws.finance+ws.sales+ws.purchasing+ws.inventory+ws.warehouse+ws.manufacturing+ws.projects+ws.service+
    ws.reporting+ws.integrations+ws.customization+ws.migration+ws.security+ws.testing+ws.training+ws.deployment+ws.hypercare+ws.documentation;
  ws.pm = 0.13*prePM;

  const base = prePM + ws.pm;

  const contPctMap = {Simple:10,Moderate:15,Complex:20,"Highly Complex":25};
  const contPct = (s.contingencyOverride!=null? s.contingencyOverride : (contPctMap[s.complexity.overall]||15));
  const contingency = base*(contPct/100);
  const total = base+contingency;

  // support (monthly, recurring - separate commercial dimension)
  const supBase = {Low:40,Medium:80,High:140,"Very High":220}[s.support.ticketVolume]||80;
  const supScale = 1+userBandIndex(c.users)*0.11;
  const supScopeAdd = Math.max(0,s.support.scope.size-3)*8;
  const supSla = {Standard:1.0,"Business Critical":1.25,Enterprise:1.5}[s.support.sla]||1;
  const supModel = {"Business hours":1.0,"Extended business hours":1.15,"24x5":1.35,"24x7":1.6}[s.support.model]||1;
  const monthlySupport = (supBase*supScale+supScopeAdd)*supSla*supModel;

  return {ws, base, contPct, contingency, total, monthlySupport, annualSupport: monthlySupport*12, uf, cof, indf};
}

function cloneState(s){
  return {
    customer:{...s.customer}, challenges:new Set(s.challenges), modules:new Set(s.modules),
    complexity:{overall:s.complexity.overall, areas:{...s.complexity.areas}},
    migration:{...s.migration, scope:new Set(s.migration.scope)},
    integrations: s.integrations.map(r=>({...r})),
    customization:{level:s.customization.level, items:{...s.customization.items}},
    reporting:{items:new Set(s.reporting.items), complexity:s.reporting.complexity},
    localization:{...s.localization}, delivery:{...s.delivery}, support:{...s.support, scope:new Set(s.support.scope)},
    contingencyOverride:s.contingencyOverride
  };
}
function bumpArea(level,dir){
  const order=["Low","Medium","High","Very High"]; let i=order.indexOf(level);
  i = Math.max(0, Math.min(order.length-1, i+dir));
  return order[i];
}
function bestCaseState(s){
  const v = cloneState(s);
  v.migration.dataQuality='Excellent';
  v.migration.cycles = Math.max(1, s.migration.cycles-1);
  v.delivery.availability='High';
  Object.keys(v.complexity.areas).forEach(k=> v.complexity.areas[k]=bumpArea(v.complexity.areas[k],-1));
  v.contingencyOverride = Math.max(6,(v.contingencyOverride!=null?v.contingencyOverride:{Simple:10,Moderate:15,Complex:20,"Highly Complex":25}[v.complexity.overall]||15)-6);
  return v;
}
function worstCaseState(s){
  const v = cloneState(s);
  v.migration.dataQuality='Poor';
  v.migration.cycles = s.migration.cycles+1;
  v.delivery.availability='Low';
  Object.keys(v.complexity.areas).forEach(k=> v.complexity.areas[k]=bumpArea(v.complexity.areas[k],1));
  v.contingencyOverride = (v.contingencyOverride!=null?v.contingencyOverride:{Simple:10,Moderate:15,Complex:20,"Highly Complex":25}[v.complexity.overall]||15)+6;
  return v;
}

function effortByRole(ws){

/* ============================= TIMELINE / TEAM ============================= */
function durationWeeks(totalEffort){ return Math.max(8, Math.min(64, Math.round(3 + totalEffort/225))); }
function peakFTE(totalEffort, weeks){ return Math.max(2, Math.min(22, Math.round(totalEffort/(weeks*31)))); }

// phase: [key,label,startPct,durPct,parallel]
const PHASES = [
  ["mobilization","Mobilisation",0,5,false],
  ["discovery","Discovery",4,10,false],
  ["design","Solution Design",12,13,false],
  ["config","Configuration",23,20,false],
  ["dev","Development (AL / integrations)",26,20,true],
  ["migration","Data Migration",30,18,true],
  ["intdev","Integration Development",30,15,true],
  ["testing","Testing",44,16,false],
  ["uat","User Acceptance Testing",57,10,false],
  ["training","Training",62,9,true],
  ["cutover","Cutover Preparation",68,7,false],
  ["golive","Go-Live",75,2,false],
  ["hypercare","Hypercare",77,10,false],
  ["transition","Transition to Support",85,6,false],
];
function timelinePlan(weeks){
  return PHASES.map(([key,label,sp,dp,par])=>{
    const start = Math.round(weeks*sp/100);
    const dur = Math.max(1, Math.round(weeks*dp/100));
    return {key,label,start, dur, end:start+dur, parallel:par};
  });
}

function confidenceScore(s){
  let known=0, total=11;
  if(s.customer.concurrentUsers>0) known++;
  if(s.customer.companies>0) known++;
  if(s.modules.size>0) known++;
  if(s.migration.dataQuality!=='Unknown') known++;
  if(s.migration.scope.size>0) known++;
  if(s.integrations.length>0 || !s.challenges.has('integration_problems')) known++;
  if(s.customization.level!=='No customization' || Object.values(s.customization.items).every(v=>v===0)) known++;
  if(s.localization.country) known++;
  if(s.customer.targetDate) known++;
  if(s.delivery.availability!=='Unknown') known++;
  if(s.support.ticketVolume) known++;
  const pct = known/total;
  const level = pct>=0.82?"High":pct>=0.55?"Medium":"Low";
  return {known,total,pct,level};
}

/* ============================= DISCOVERY QUESTIONS ============================= */
function discoveryQuestions(s){
  const crit=[], imp=[], nice=[];
  if(!s.customer.concurrentUsers) crit.push("What is the expected number of concurrent users vs. total named users?");
  if(s.migration.dataQuality==='Unknown'||s.migration.dataQuality==='Poor') crit.push(`What is the actual data quality / state of the legacy system(s) (${s.migration.source})? A data quality assessment should precede final pricing.`);
  if(s.integrations.length===0 && s.challenges.has('integration_problems')) crit.push("Which systems must integrate with Business Central, and what protocols / APIs do they expose?");
  if(!s.customer.targetDate) crit.push("Is there a fixed go-live date driving the timeline, and what is it anchored to (e.g. financial year-end, contract expiry)?");
  if(s.customer.companies>1) crit.push(`How will intercompany transactions and eliminations be handled across the ${s.customer.companies} companies / ${s.customer.entities} legal entities?`);
  if(s.localization.multiCountry && !s.localization.statutory) crit.push("What statutory reporting and e-invoicing requirements apply in each operating country?");
  if((s.customization.level==='Significant customization'||s.customization.level==='Extensive customization') && Object.values(s.customization.items).reduce((a,b)=>a+b,0)===0) crit.push("What specific custom functionality is required beyond standard Business Central, and why can't it be met with configuration?");

  if(!s.support.ticketVolume) imp.push("What is the expected support ticket volume post go-live, based on the legacy environment's history?");
  if(s.reporting.complexity==='High' && !s.modules.has('powerbi')) imp.push("Should Power BI be scoped as part of this engagement, or is reporting/BI handled by the customer's own team?");
  if(s.migration.cycles<=1 && (s.migration.dataQuality==='Poor'||s.migration.dataQuality==='Unknown')) imp.push("Given current data quality, should an additional mock migration cycle be budgeted before cutover?");
  if(["Manufacturing","Food & Beverage","Pharmaceuticals / Life Sciences","Automotive"].includes(s.customer.industry) && !MODULES.some(m=>m.ws==='manufacturing'&&s.modules.has(m.id))) imp.push("Is manufacturing functionality required, or is production planning/execution managed outside Business Central?");
  if(s.customer.extUsers>0) imp.push(`What access model is required for the ${s.customer.extUsers} external users (customer/vendor self-service, licensing type)?`);
  imp.push("Which third-party ISV extensions (if any) are already in use or planned, and have they been validated against the target BC version?");

  nice.push("What training delivery model is preferred (train-the-trainer, role-based classroom, self-paced)?");
  nice.push("What is the required retention period for historical data not migrated into Business Central?");
  nice.push("What sandbox / environment strategy is expected (number of environments, refresh cadence)?");
  nice.push("Are there change-management or communications resources on the customer side to support adoption?");
  return {crit,imp,nice};
}

function risks(s){

    {t:"Integration dependencies on third-party vendors slip the schedule.", cond: s.integrations.length>=2, prob:"Medium", impact:"Medium",
      mit:"Confirm third-party technical contacts and API availability during Discovery; sequence integration dev early."},
    {t:"Customer resource / SME availability constrains progress.", cond: s.delivery.availability==='Low', prob:"High", impact:"Medium",
      mit:"Agree a resourcing plan and RACI with the customer sponsor before Configuration begins."},
    {t:"Compressed timeline forces parallel workstreams beyond safe capacity.", cond: !!s.customer.targetDate, prob:"Medium", impact:"Medium",
      mit:"Validate the target date against the phase plan in Discovery; flag conflicts immediately."},
    {t:"Localisation complexity (multi-country / multi-tax) exceeds standard BC coverage.", cond: s.localization.multiCountry||s.localization.multiTax, prob:"Medium", impact:"High",
      mit:"Validate standard localisation coverage per country before pricing statutory development."},
    {t:"Third-party ISV extensions conflict with target BC version or planned customisation.", cond: true, prob:"Low", impact:"Medium",
      mit:"Audit installed extensions during Discovery; confirm compatibility with target version."},
    {t:"Insufficient testing coverage leads to post-go-live defects.", cond: s.complexity.overall==='Complex'||s.complexity.overall==='Highly Complex', prob:"Medium", impact:"High",
      mit:"Formal test plan with traceability to requirements; independent UAT sign-off gate."},
    {t:"Scope creep via informal change requests.", cond: true, prob:"Medium", impact:"Medium",
      mit:"Enforce a change-control process from kick-off; log all scope changes against the assumptions register."},
    {t:"Delayed customer decisions on design options stall Configuration.", cond: true, prob:"Medium", impact:"Medium",

/* ============================= CHART HELPERS ============================= */
const chartRegistry = {};
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function destroyChart(id){ if(chartRegistry[id]){ chartRegistry[id].destroy(); delete chartRegistry[id]; } }
function baseChartFont(){ return {family: "'IBM Plex Sans', system-ui, sans-serif", size: 11}; }

function hBarChart(canvasId, labels, data, color, unit){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const ink = cssVar('--chart-ink-2'), grid = cssVar('--chart-grid'), axis = cssVar('--chart-axis');
  chartRegistry[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[{data, backgroundColor:color, borderRadius:4, barThickness:16, maxBarThickness:18}]},
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>` ${fmtH(c.parsed.x)} ${unit}`}}},
      scales:{
        x:{beginAtZero:true, grid:{color:grid, drawTicks:false}, ticks:{color:ink, font:baseChartFont()}, border:{color:axis}},
        y:{grid:{display:false}, ticks:{color:ink, font:baseChartFont()}, border:{color:axis}}
      }
    }
  });
}
function donutChart(canvasId, labels, data, colors){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const ink = cssVar('--chart-ink-2');
  chartRegistry[canvasId] = new Chart(ctx, {
    type:'doughnut',
    data:{labels, datasets:[{data, backgroundColor:colors, borderColor:cssVar('--chart-surface'), borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{legend:{position:'bottom', labels:{color:ink, font:baseChartFont(), boxWidth:10, padding:14}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${fmtH(c.parsed)} h`}}}
    }
  });
}
function vBarChart(canvasId, labels, data, colors, unit){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const ink = cssVar('--chart-ink-2'), grid = cssVar('--chart-grid'), axis = cssVar('--chart-axis');
  chartRegistry[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[{data, backgroundColor:colors, borderRadius:5, maxBarThickness:64}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>` ${fmtH(c.parsed.y)} ${unit}`}},
        datalabels:false},
      scales:{
        x:{grid:{display:false}, ticks:{color:ink, font:baseChartFont()}, border:{color:axis}},
        y:{beginAtZero:true, grid:{color:grid, drawTicks:false}, ticks:{color:ink, font:baseChartFont()}, border:{color:axis}}
      }
    }
  });
}
function tableToggle(headers, rows){
  return `<details class="tbl-toggle"><summary>Show data table</summary><table class="ctable"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
}

/* ============================= DASHBOARD PANEL ============================= */
function renderDashboard(res){
  const s = state; const weeks = durationWeeks(res.total); const months=(weeks/4.345).toFixed(1);
  const team = peakFTE(res.total, weeks); const conf = confidenceScore(s);
  const low = runEngine(bestCaseState(s)).total, high = runEngine(worstCaseState(s)).total;

  const el = document.getElementById('panel-dashboard');
  el.innerHTML = `
  <div class="panel-head"><h1>Delivery &amp; Estimate Dashboard</h1></div>
  <p class="panel-sub">Indicative Pre-Sales Estimate. Subject to Discovery and Validation. All figures are benchmark-based and traceable to the inputs on the Inputs tab.</p>

  <div class="stat-row">
    <div class="stat-tile accent"><div class="l">Expected effort</div><div class="v">${fmtH(res.total)}<small> h</small></div></div>
    <div class="stat-tile"><div class="l">Effort range</div><div class="v" style="font-size:17px">${fmtH(low)}&ndash;${fmtH(high)}<small> h</small></div></div>
    <div class="stat-tile"><div class="l">Duration</div><div class="v">${months}<small> mo</small></div></div>
    <div class="stat-tile"><div class="l">Team (peak)</div><div class="v">${team}<small> FTE</small></div></div>
    <div class="stat-tile"><div class="l">Monthly support</div><div class="v">${fmtH(res.monthlySupport)}<small> h/mo</small></div></div>
    <div class="stat-tile"><div class="l">Complexity</div><div class="v" style="font-size:17px">${s.complexity.overall}</div></div>
    <div class="stat-tile"><div class="l">Estimate confidence</div><div class="v" style="font-size:17px"><span class="pill dot ${conf.level==='High'?'good':conf.level==='Medium'?'warning':'critical'}">${conf.level}</span></div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <h3 style="font-size:14px;margin-bottom:8px">Implementation Effort Range</h3>
    <div style="display:flex;gap:26px;flex-wrap:wrap;font-family:var(--font-mono)">
      <div><div style="font-size:11px;color:var(--text-3);text-transform:uppercase">Low</div><div style="font-size:19px;font-weight:600">${fmtH(low)} h</div></div>
      <div><div style="font-size:11px;color:var(--text-3);text-transform:uppercase">Expected</div><div style="font-size:19px;font-weight:600;color:var(--brand)">${fmtH(res.total)} h</div></div>
      <div><div style="font-size:11px;color:var(--text-3);text-transform:uppercase">High</div><div style="font-size:19px;font-weight:600">${fmtH(high)} h</div></div>
    </div>
    <p style="color:var(--text-3);font-size:11.5px;margin:10px 0 0">Low = best case (excellent data quality, one fewer migration cycle, complexity stepped down one band, high customer availability). High = conservative case (poor data quality, one extra migration cycle, complexity stepped up one band, low availability). Never treat as a guaranteed quote.</p>
  </div>

  <div class="grid2">
    <div class="chart-card">
      <h3>Effort by Workstream</h3><div class="cap">Base hours, before contingency</div>
      <div class="chart-wrap" style="height:${Math.max(260,WS_ORDER.length*22)}px"><canvas id="chartWorkstream"></canvas></div>
      <div id="tblWorkstream"></div>
    </div>
    <div class="chart-card">
      <h3>Effort by Role</h3><div class="cap">Base hours allocated across delivery roles</div>
      <div class="chart-wrap" id="roleChartWrap" style="height:260px"><canvas id="chartRole"></canvas></div>
      <div id="tblRole"></div>
    </div>
  </div>
  <div class="grid2">
    <div class="chart-card">
      <h3>Effort by Phase</h3><div class="cap">Base hours (before contingency), functional &amp; technical hours mapped to delivery phase</div>
      <div class="chart-wrap" style="height:260px"><canvas id="chartPhase"></canvas></div>
      <div id="tblPhase"></div>
    </div>
    <div class="chart-card">
      <h3>Implementation vs Migration vs Support</h3><div class="cap">Implementation &amp; migration are one-off hours including contingency; support is hours/year</div>
      <div class="chart-wrap" style="height:260px"><canvas id="chartMix"></canvas></div>
      <div id="tblMix"></div>
    </div>
  </div>
  <div class="chart-card" style="max-width:560px">
    <h3>Risk Distribution</h3><div class="cap">Count of register risks by current probability rating</div>
    <div class="chart-wrap" style="height:220px"><canvas id="chartRisk"></canvas></div>
    <div id="tblRisk"></div>
  </div>

  <details class="acc"><summary><span class="badge-num">i</span>Methodology &amp; traceability<span class="chevron">&rsaquo;</span></summary>
    <div class="acc-body">
      <div class="method-box">
        Every workstream is calculated as <code>Base Effort &times; Scope Factor &times; Complexity Factor &times; Data/Integration Factor &times; Deployment Factor</code>.
        Base effort comes from selected modules, migration data categories, integration rows and customisation counts (estimation benchmarks, not official Microsoft figures).
        Complexity factors: Low &times;0.82, Medium &times;1.00, High &times;1.32, Very High &times;1.68. User-count and multi-company factors scale functional workstreams; data quality and migration cycles scale the Migration workstream only.
        Contingency (${res.contPct}% here) is layered on top of the summed workstreams, never hidden inside them, and is NOT included in the Workstream, Role or Phase charts above &mdash; only in the KPI bar, the Implementation vs Migration split, and the Executive Summary. Change any input on the Inputs tab and every figure on this page recalculates immediately.
      </div>
    </div>
  </details>
  `;

  // Workstream chart (exclude near-zero to keep it legible)
  const wsEntries = WS_ORDER.map(k=>[WS_LABELS[k], res.ws[k]]).filter(([,v])=>v>0.5).sort((a,b)=>b[1]-a[1]);
  hBarChart('chartWorkstream', wsEntries.map(e=>e[0]), wsEntries.map(e=>Math.round(e[1])), cssVar('--series-1'), 'h');
  document.getElementById('tblWorkstream').innerHTML = tableToggle(['Workstream','Hours'], wsEntries.map(([l,v])=>[l, fmtH(v)]));

  // Role chart
  const roleEntries = effortByRole(res.ws);
  document.getElementById('roleChartWrap').style.height = Math.max(260, roleEntries.length*24)+'px';
  hBarChart('chartRole', roleEntries.map(e=>e[0]), roleEntries.map(e=>Math.round(e[1])), cssVar('--series-7'), 'h');
  document.getElementById('tblRole').innerHTML = tableToggle(['Role','Hours'], roleEntries.map(([l,v])=>[l, fmtH(v)]));

  // Phase chart
  const phaseHours = {}; PHASES.forEach(p=>phaseHours[p[0]]=0);
  WS_ORDER.forEach(k=>{ if(k==='pm') return; const target = PHASE_ALLOC[k]; if(target!=null) phaseHours[target]=(phaseHours[target]||0)+res.ws[k]; });
  const pmSplit = res.ws.pm/4;
  ['mobilization','discovery','design','config'].forEach(p=> phaseHours[p]=(phaseHours[p]||0)+pmSplit);
  const phaseEntries = PHASES.map(p=>[p[1], phaseHours[p[0]]||0]).filter(([,v])=>v>0.5);
  vBarChart('chartPhase', phaseEntries.map(e=>e[0]), phaseEntries.map(e=>Math.round(e[1])), cssVar('--series-3'), 'h');
  document.getElementById('tblPhase').innerHTML = tableToggle(['Phase','Hours'], phaseEntries.map(([l,v])=>[l, fmtH(v)]));

  // Mix chart — apply contingency proportionally to migration and non-migration hours
  // so this split (and its total) matches res.total exactly, consistent with the KPI bar.
  const migShare = res.base>0 ? res.ws.migration/res.base : 0;
  const migWithContingency = res.ws.migration + res.contingency*migShare;
  const implHours = res.total - migWithContingency;
  const mixLabels = ['Implementation (one-off h)','Migration (one-off h)','Support (h / year)'];
  const mixData = [Math.round(implHours), Math.round(migWithContingency), Math.round(res.annualSupport)];
  donutChart('chartMix', mixLabels, mixData, [cssVar('--series-1'), cssVar('--series-2'), cssVar('--series-3')]);
  document.getElementById('tblMix').innerHTML = tableToggle(['Category','Hours'], mixLabels.map((l,i)=>[l, fmtH(mixData[i])]));

  // Risk distribution
  const rk = risks(s); const counts = {Low:0,Medium:0,High:0};
  rk.forEach(r=> counts[r.prob]=(counts[r.prob]||0)+1);
  vBarChart('chartRisk', ['Low','Medium','High'], [counts.Low,counts.Medium,counts.High], [cssVar('--chart-good'),cssVar('--chart-warning'),cssVar('--chart-critical')], 'risks');
  document.getElementById('tblRisk').innerHTML = tableToggle(['Probability','Count of risks'], [['Low',counts.Low],['Medium',counts.Medium],['High',counts.High]]);
}

/* ============================= SCENARIOS PANEL ============================= */
function scenarioVariant(tier){
  const v = cloneState(state);
  if(tier==='A'){
    v.customization.level='Minimal customization';
    v.migration.cycles = 1;
    v.reporting.complexity='Low';
    v.integrations = state.integrations.slice(0,1);
    Object.keys(v.complexity.areas).forEach(k=>{ if(v.complexity.areas[k]==='High'||v.complexity.areas[k]==='Very High') v.complexity.areas[k]='Medium'; });
  } else if(tier==='B'){
    if(v.customization.level==='No customization') v.customization.level='Moderate customization';
  } else if(tier==='C'){
    const order=Object.keys(CUSTOM_LEVEL_BASE); let i=order.indexOf(v.customization.level); i=Math.min(order.length-1,i+1); v.customization.level=order[i];
    v.migration.cycles = state.migration.cycles+1;
    v.reporting.complexity='High';
    v.integrations = state.integrations.concat([
      {id:9001,name:'Additional system A',category:'Custom application',direction:'Bidirectional',complexity:'High',mode:'Real-time',interfaces:2},
      {id:9002,name:'Additional system B',category:'Legacy application',direction:'Bidirectional',complexity:'Medium',mode:'Batch',interfaces:2}]);
    Object.keys(v.complexity.areas).forEach(k=> v.complexity.areas[k]=bumpArea(v.complexity.areas[k],1));
  }
  return v;
}
function qualitativeComplexity(total){ return total<900?'Low':total<1800?'Medium':total<3200?'High':'Very High'; }

    <div class="card"><h3 style="font-size:13.5px">B: Enhanced Implementation</h3><p style="font-size:12.5px;color:var(--text-2);margin:6px 0 0">Current inputs as entered, plus additional reporting, integrations and workflow as scoped.</p></div>
    <div class="card"><h3 style="font-size:13.5px">C: Complex Transformation</h3><p style="font-size:12.5px;color:var(--text-2);margin:6px 0 0">Elevated customisation, extra migration cycle, high reporting complexity, two additional integrations.</p></div>
  </div>
  <table class="scenario-table">
    <thead><tr><th>Metric</th><th>Scenario A</th><th>Scenario B</th><th>Scenario C</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="metric">${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody>
